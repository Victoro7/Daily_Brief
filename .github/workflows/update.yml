name: Update Diagnostics Desk

on:
  schedule:
    - cron: "30 10 * * *"   # 10:30 UTC daily (about 5:30 AM Eastern)
  workflow_dispatch:         # lets you run it manually from the Actions tab

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Build feed and brief
        run: python build.py
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}

      - name: Commit changes
        run: |
          git config user.name "dx-desk-bot"
          git config user.email "dx-desk-bot@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || (git commit -m "Update $(date -u +%F)" && git push)
